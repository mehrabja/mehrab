[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reposentinel"
version = "0.1.0"
description = "Local defensive security hygiene checks for source repositories."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mehrab Jalilian" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<7"]

[project.scripts]
reposentinel = "reposentinel.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
