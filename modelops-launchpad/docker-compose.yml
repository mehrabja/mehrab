services:
  model-api:
    build: .
    image: mehrabja/modelops-launchpad:local
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/artifacts/model.joblib
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/readyz', timeout=2)"
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 15s
