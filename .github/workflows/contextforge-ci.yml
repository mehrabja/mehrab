name: ContextForge CI

on:
  workflow_dispatch:
  push:
    paths:
      - "contextforge/**"
      - ".github/workflows/contextforge-ci.yml"
  pull_request:
    paths:
      - "contextforge/**"
      - ".github/workflows/contextforge-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contextforge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contextforge/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: PYTHONPATH=. python eval/run_eval.py
