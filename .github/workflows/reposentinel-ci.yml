name: RepoSentinel CI

on:
  workflow_dispatch:
  push:
    paths:
      - "reposentinel/**"
      - ".github/workflows/reposentinel-ci.yml"
  pull_request:
    paths:
      - "reposentinel/**"
      - ".github/workflows/reposentinel-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reposentinel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Scan implementation package
        run: reposentinel reposentinel --format sarif --output reposentinel.sarif --fail-on critical
