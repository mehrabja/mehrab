name: RepoSentinel CI

on:
  workflow_dispatch:
  push:
    paths:
      - "reposentinel/**"
      - ".github/workflows/reposentinel-ci.yml"
  pull_request:
    paths:
      - "reposentinel/**"
      - ".github/workflows/reposentinel-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reposentinel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Scan implementation package
        run: reposentinel reposentinel --format sarif --output reposentinel.sarif --fail-on critical
