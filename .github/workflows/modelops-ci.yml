name: ModelOps Launchpad CI

on:
  workflow_dispatch:
  push:
    paths:
      - "modelops-launchpad/**"
      - ".github/workflows/modelops-ci.yml"
  pull_request:
    paths:
      - "modelops-launchpad/**"
      - ".github/workflows/modelops-ci.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modelops-launchpad
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modelops-launchpad/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/train.py --output-dir artifacts
      - run: pytest -q
      - name: Build container image
        run: docker build -t modelops-launchpad:test .
