name: ModelOps Launchpad CI

on:
  workflow_dispatch:
  push:
    paths:
      - "modelops-launchpad/**"
      - ".github/workflows/modelops-ci.yml"
  pull_request:
    paths:
      - "modelops-launchpad/**"
      - ".github/workflows/modelops-ci.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modelops-launchpad
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modelops-launchpad/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/train.py --output-dir artifacts
      - run: PYTHONPATH=. pytest -q --cov=app --cov-report=term-missing
      - name: Add coverage to job summary
        run: coverage report -m >> "$GITHUB_STEP_SUMMARY"
      - name: Build container image
        run: docker build -t modelops-launchpad:test .
